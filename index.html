<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Thumb Fitts' Law Experiment</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #phone-frame {
            width: 100vw;
            height: 100vh;
            max-width: 420px;
            max-height: 850px;
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        header {
            padding: 12px;
            background-color: #252525;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 1.1rem;
            color: #00e676;
        }
        #stats {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 4px;
        }
        #canvas-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #181818;
        }
        .target {
            position: absolute;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.05s ease;
        }
        .target:active {
            transform: scale(0.95);
        }
        #start-btn {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #000;
            z-index: 10;
        }
        #action-target {
            background: linear-gradient(135deg, #ff3d00, #ff6e40);
            color: #fff;
            z-index: 20;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 18, 18, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 100;
        }
        .instructions {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ccc;
            margin-bottom: 20px;
        }
        .btn-ui {
            background-color: #00e676;
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
            margin: 6px 0;
            width: 80%;
        }
        .btn-ui:disabled {
            background-color: #444;
            color: #888;
            box-shadow: none;
        }
        #feedback-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease-out;
            z-index: 50;
        }
        .hit { background-color: rgba(0, 230, 118, 0.15); opacity: 1 !important; }
        .miss { background-color: rgba(255, 23, 68, 0.25); opacity: 1 !important; }
    </style>
</head>
<body>

<div id="phone-frame">
    <header>
        <h1>Thumb Fitts' Law Experiment</h1>
        <div id="stats">Trial: <span id="trial-count">0</span> / 36</div>
    </header>

    <div id="canvas-container">
        <div id="feedback-flash"></div>
        <div id="start-btn" class="target" style="display:none;">START</div>
        <div id="action-target" class="target" style="display:none;">TAP</div>
    </div>

    <div id="overlay">
        <h2>One-Handed Mobile Experiment</h2>
        <div class="instructions">
            <p><strong>Instructions:</strong></p>
            <p>1. Hold your phone in <strong>one hand</strong> using only your <strong>thumb</strong>.</p>
            <p>2. Tap the green <strong>START</strong> button at the bottom-right home zone.</p>
            <p>3. Rapidly tap the red <strong>TARGET</strong> button as fast and accurately as possible.</p>
        </div>
        <button id="begin-exp-btn" class="btn-ui">Begin Experiment</button>
        <button id="download-csv-btn" class="btn-ui" style="background-color: #29b6f6; display: none;">Download CSV Data</button>
    </div>
</div>

<script>
    // Configuration & State
    const distances = [140, 280, 420]; // Target Distances (A) in pixels
    const widths = [36, 60, 84];       // Target Widths (W) in pixels
    const trialsPerCondition = 4;
    
    let conditions = [];
    let currentTrialIndex = 0;
    let startTime = 0;
    let trialActive = false;
    let trialData = [];
    let missCount = 0;

    // DOM Elements
    const startBtn = document.getElementById('start-btn');
    const actionTarget = document.getElementById('action-target');
    const overlay = document.getElementById('overlay');
    const beginExpBtn = document.getElementById('begin-exp-btn');
    const downloadCsvBtn = document.getElementById('download-csv-btn');
    const trialCountEl = document.getElementById('trial-count');
    const feedbackFlash = document.getElementById('feedback-flash');
    const canvas = document.getElementById('canvas-container');

    // Generate balanced randomized trial order
    function generateConditions() {
        let condList = [];
        for (let a of distances) {
            for (let w of widths) {
                for (let i = 0; i < trialsPerCondition; i++) {
                    condList.push({ A: a, W: w });
                }
            }
        }
        // Fisher-Yates shuffle
        for (let i = condList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [condList[i], condList[j]] = [condList[j], condList[i]];
        }
        return condList;
    }

    // Initialize Experiment Setup
    function initExperiment() {
        conditions = generateConditions();
        currentTrialIndex = 0;
        trialData = [];
        trialCountEl.textContent = '0';
        overlay.style.display = 'none';
        setupStartButton();
    }

    // Position the home start button in the bottom-right thumb rest zone
    function setupStartButton() {
        const startSize = 64;
        const rect = canvas.getBoundingClientRect();
        
        // Positioned in bottom-right area (natural thumb rest for right-handers)
        const left = rect.width - startSize - 25;
        const top = rect.height - startSize - 35;

        startBtn.style.width = `${startSize}px`;
        startBtn.style.height = `${startSize}px`;
        startBtn.style.left = `${left}px`;
        startBtn.style.top = `${top}px`;
        startBtn.style.display = 'flex';
        
        actionTarget.style.display = 'none';
        trialActive = false;
    }

    // Trigger next trial state
    function prepareTarget() {
        const currentCond = conditions[currentTrialIndex];
        const A = currentCond.A;
        const W = currentCond.W;

        const startRect = startBtn.getBoundingClientRect();
        const canvasRect = canvas.getBoundingClientRect();

        // Calculate center of start button relative to canvas
        const startCenterX = (startRect.left + startRect.width / 2) - canvasRect.left;
        const startCenterY = (startRect.top + startRect.height / 2) - canvasRect.top;

        // Generate angle reaching upward/leftward arc (typical thumb stretch range: 105° to 165°)
        const angle = (Math.PI / 180) * (105 + Math.random() * 60);

        // Position target at distance A away along the angle
        let targetCenterX = startCenterX - A * Math.cos(angle - Math.PI/2);
        let targetCenterY = startCenterY - A * Math.sin(angle - Math.PI/2);

        // Clamping to screen boundary padding
        const pad = W / 2 + 5;
        targetCenterX = Math.max(pad, Math.min(canvasRect.width - pad, targetCenterX));
        targetCenterY = Math.max(pad, Math.min(canvasRect.height - pad, targetCenterY));

        actionTarget.style.width = `${W}px`;
        actionTarget.style.height = `${W}px`;
        actionTarget.style.left = `${targetCenterX - W / 2}px`;
        actionTarget.style.top = `${targetCenterY - W / 2}px`;
        
        // Hide start, show target
        startBtn.style.display = 'none';
        actionTarget.style.display = 'flex';

        // Precise timing start
        missCount = 0;
        startTime = performance.now();
        trialActive = true;
    }

    // Visual feedback handler
    function triggerFeedback(isHit) {
        feedbackFlash.className = isHit ? 'hit' : 'miss';
        setTimeout(() => { feedbackFlash.className = ''; }, 150);
    }

    // Handle Start Click
    function handleStartPress(e) {
        e.preventDefault();
        e.stopPropagation();
        prepareTarget();
    }

    // Handle Action Target Click
    function handleTargetPress(e) {
        e.preventDefault();
        e.stopPropagation();
        if (!trialActive) return;

        const endTime = performance.now();
        const movementTime = Math.round(endTime - startTime);
        const currentCond = conditions[currentTrialIndex];
        
        // Shannon Formulation: ID = log2(A / W + 1)
        const idBits = Math.log2(currentCond.A / currentCond.W + 1).toFixed(3);

        // Log record
        trialData.push({
            trial: currentTrialIndex + 1,
            distance_A: currentCond.A,
            width_W: currentCond.W,
            id_bits: idBits,
            movement_time_ms: movementTime,
            errors: missCount
        });

        triggerFeedback(true);
        currentTrialIndex++;
        trialCountEl.textContent = currentTrialIndex;

        if (currentTrialIndex < conditions.length) {
            setupStartButton();
        } else {
            endExperiment();
        }
    }

    // Track misclicks inside the canvas area during trial
    function handleCanvasMiss(e) {
        if (!trialActive) return;
        if (e.target === canvas || e.target === feedbackFlash) {
            missCount++;
            triggerFeedback(false);
        }
    }

    // Complete Experiment & Show Export Screen
    function endExperiment() {
        trialActive = false;
        actionTarget.style.display = 'none';
        startBtn.style.display = 'none';
        
        overlay.querySelector('h2').textContent = 'Experiment Completed!';
        overlay.querySelector('.instructions').innerHTML = `
            <p>You have finished all 36 trials.</p>
            <p>Download your raw dataset below to calculate your linear regression model ($MT = a + b \\cdot ID$) and embed the results on your page.</p>
        `;
        beginExpBtn.textContent = 'Restart Test';
        downloadCsvBtn.style.display = 'block';
        overlay.style.display = 'flex';
    }

    // CSV Download Function
    function downloadCSV() {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Trial,Distance_A,Width_W,ID_bits,MovementTime_ms,Errors\n";

        trialData.forEach(row => {
            csvContent += `${row.trial},${row.distance_A},${row.width_W},${row.id_bits},${row.movement_time_ms},${row.errors}\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `fitts_law_thumb_data_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Event Listeners (Using pointerdown to remove mobile tap latency)
    startBtn.addEventListener('pointerdown', handleStartPress);
    actionTarget.addEventListener('pointerdown', handleTargetPress);
    canvas.addEventListener('pointerdown', handleCanvasMiss);
    
    beginExpBtn.addEventListener('click', initExperiment);
    downloadCsvBtn.addEventListener('click', downloadCSV);
</script>
</body>
</html>
